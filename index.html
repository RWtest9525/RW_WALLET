    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#2563eb">
    <link rel="canonical" href="https://rw-wallet.vercel.app/">
    <link rel="preconnect" href="https://i.ibb.co">
    <link rel="preconnect" href="https://cdn-icons-png.flaticon.com">

    <link rel="preconnect" href="https://upload.wikimedia.org">
    <link rel="icon" href="https://i.ibb.co/x8YBYwGG/6233389803554672153.jpg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/x8YBYwGG/6233389803554672153.jpg">
    <link rel="preload" as="image" href="https://i.ibb.co/x8YBYwGG/6233389803554672153.jpg" fetchpriority="high">
    <link rel="preload" as="image" href="https://cdn-icons-png.flaticon.com/512/2040/2040946.png" fetchpriority="high">
    <link rel="preload" as="image" href="/profile_card_bg.png" fetchpriority="high">
    <link rel="preload" as="image" href="/referral_banner.png" fetchpriority="high">
    <link rel="preload" as="image" href="/referral_howitworks_cards.png" fetchpriority="high">
    <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans">
    <div id="rw-wallet-root">
        <!-- Instant 0ms App Startup Splash Screen (Eliminates white screen on app launch) -->
        <style>
            #instant-splash {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 99999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background: #0f172a;
                background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
                color: #ffffff;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                padding: 24px;
                box-sizing: border-box;
                text-align: center;
                user-select: none;
                -webkit-user-select: none;
            }
            .splash-logo-wrap {
                position: relative;
                width: 88px;
                height: 88px;
                margin-bottom: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .splash-pulse {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border-radius: 24px;
                background: rgba(59, 130, 246, 0.3);
                animation: splashPing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
            }
            @keyframes splashPing {
                75%, 100% { transform: scale(1.4); opacity: 0; }
            }
            .splash-img {
                position: relative;
                width: 80px;
                height: 80px;
                border-radius: 22px;
                object-fit: cover;
                border: 2px solid rgba(147, 197, 253, 0.5);
                box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            }
            .splash-title {
                font-size: 22px;
                font-weight: 900;
                margin: 0 0 6px 0;
                letter-spacing: -0.5px;
                color: #ffffff;
            }
            .splash-sub {
                font-size: 11px;
                font-weight: 700;
                color: #93c5fd;
                letter-spacing: 2px;
                text-transform: uppercase;
                margin: 0 0 28px 0;
            }
            .splash-loader {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .splash-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #3b82f6;
                animation: splashBounce 1.2s infinite ease-in-out;
            }
            .splash-dot:nth-child(1) { animation-delay: -0.32s; }
            .splash-dot:nth-child(2) { animation-delay: -0.16s; }
            @keyframes splashBounce {
                0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
                40% { transform: scale(1); opacity: 1; }
            }
        </style>
        <div id="instant-splash">
            <div class="splash-logo-wrap">
                <div class="splash-pulse"></div>
                <img src="https://i.ibb.co/x8YBYwGG/6233389803554672153.jpg" alt="Reviews World" class="splash-img">
            </div>
            <h1 class="splash-title">Reviews World</h1>
            <p class="splash-sub">Do tasks • Earn rewards</p>
            <div class="splash-loader">
                <div class="splash-dot"></div>
                <div class="splash-dot"></div>
                <div class="splash-dot"></div>
            </div>
        </div>
    </div>

    <!-- <script src="/puter.js"></script> -->
    <script type="module" src="/src/core/onesignal.js"></script>
    <script type="module" src="/src/core/custom-deeplink.js"></script>
    <script type="module" src="/src/shell.js"></script>
    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>

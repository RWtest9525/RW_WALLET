<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RW Wallet Manager - Reviews World</title>
    
    <!-- External Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Circular Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3CclipPath id='circle'%3E%3Ccircle cx='50' cy='50' r='50'/%3E%3C/clipPath%3E%3Cimage href='https://i.ibb.co/x8YBYwGG/6233389803554672153.jpg' width='100' height='100' clip-path='url(%23circle)'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="https://i.ibb.co/x8YBYwGG/6233389803554672153.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                },
            },
        }
    </script>
    
    <!-- OneSignal -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({
                appId: "4affd7dd-a2c1-4b94-8253-dde142f4c847",
                safari_web_id: "web.onesignal.auto.1969a531-155e-4c74-883a-18e03006540c",
                notifyButton: { enable: true },
            });
        });
    </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans">
    <!-- UI Infrastructure -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="loading-spinner"></div>
    </div>
    <div id="notification-toast"></div>
    <div id="push-notification-container"></div>
    <div id="modal-container"></div>

    <!-- App Shell -->
    <div id="app" class="container mx-auto p-4 max-w-7xl relative">
        
        <!-- Auth Screen -->
        <div id="auth-screen" class="hidden fade-in">
            <div class="flex min-h-full items-center justify-center py-12 px-4">
                <div class="w-full max-w-md bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-lg">
                    <div class="flex justify-center items-center mb-6">
                        <img src="https://i.ibb.co/x8YBYwGG/6233389803554672153.jpg" alt="Logo" class="w-12 h-12 rounded-full mr-4">
                        <div>
                            <h2 class="text-2xl font-bold">Digital Wallet</h2>
                            <p class="text-xs text-gray-500 uppercase">Reviews World</p>
                        </div>
                    </div>
                    
                    <h3 id="auth-title" class="text-xl font-bold text-center mb-2">Access your Account</h3>
                    <div id="auth-error" class="text-red-500 text-sm mb-4 text-center"></div>
                    
                    <form id="auth-form" data-auth-mode="login" class="space-y-4">
                        <div class="form-field-group space-y-4">
                            <input type="text" id="name" placeholder="Full Name" class="w-full px-4 py-3 bg-gray-100 dark:bg-gray-700 rounded-lg">
                            <input type="tel" id="mobile" placeholder="Mobile Number" class="w-full px-4 py-3 bg-gray-100 dark:bg-gray-700 rounded-lg">
                        </div>
                        <input type="email" id="email" placeholder="Email Address" required class="w-full px-4 py-3 bg-gray-100 dark:bg-gray-700 rounded-lg">
                        <div class="relative">
                            <input type="password" id="password" placeholder="Password" required class="w-full px-4 py-3 bg-gray-100 dark:bg-gray-700 rounded-lg pr-12">
                            <button type="button" id="password-toggle" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400">
                                <svg id="eye-open" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                                <svg id="eye-closed" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/></svg>
                            </button>
                        </div>
                        <div class="flex justify-end">
                            <a href="#" id="forgot-password-link" class="text-sm text-blue-500 hover:underline">Forgot Password?</a>
                        </div>
                        <button type="submit" id="auth-button" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition flex justify-center items-center h-12">
                            <span class="button-text">Login</span>
                            <div class="loader hidden"></div>
                        </button>
                    </form>
                    
                    <p class="text-center text-sm text-gray-500 mt-6">
                        <span id="auth-prompt">Don't have an account?</span>
                        <a href="#" id="auth-toggle" class="font-bold text-blue-500 hover:underline">Sign Up</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div id="main-content" class="hidden fade-in">
            <header class="flex justify-between items-center mb-6 bg-white dark:bg-gray-800 p-4 rounded-xl shadow-md header-border">
                <div class="flex items-center">
                    <img src="https://i.ibb.co/x8YBYwGG/6233389803554672153.jpg" alt="Logo" class="w-10 h-10 rounded-full mr-3">
                    <div>
                        <h1 class="text-xl font-bold">Digital Wallet</h1>
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest">Reviews World</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-3">
                    <button id="notification-bell" class="p-2 bg-gray-100 dark:bg-gray-700 rounded-full relative">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                        <span id="notification-count" class="notification-badge hidden">0</span>
                    </button>
                    <button id="main-menu-btn" class="p-2 bg-gray-100 dark:bg-gray-700 rounded-full">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                </div>
            </header>

            <div id="dashboard-content">
                <div class="mb-6 border-b border-gray-200 dark:border-gray-700">
                    <nav id="tabs-container" class="flex space-x-6">
                        <button data-tab="user-panel" class="tab-button px-1 py-4 font-bold text-sm border-b-2" aria-selected="true">My Wallet</button>
                        <button data-tab="admin-panel" id="admin-tab-button" class="tab-button px-1 py-4 font-bold text-sm border-b-2 hidden" aria-selected="false">Admin Panel</button>
                    </nav>
                </div>

                <!-- Panels -->
                <div id="user-panel" class="tab-content">
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="space-y-6">
                            <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-md">
                                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Available Balance</h3>
                                <p id="user-balance" class="text-4xl font-black mt-2">₹0.00</p>
                            </div>
                            <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-md space-y-3">
                                <button id="withdraw-fund-btn" class="w-full bg-yellow-500 text-white font-bold py-4 rounded-xl hover:bg-yellow-600 transition shadow-lg">Withdraw</button>
                                <button id="redeem-gift-card-btn" class="w-full bg-green-500 text-white font-bold py-4 rounded-xl hover:bg-green-600 transition shadow-lg">Redeem Code</button>
                                <button id="pay-to-wallet-btn" class="w-full bg-purple-600 text-white font-bold py-4 rounded-xl hover:bg-purple-700 transition shadow-lg">Send Money</button>
                            </div>
                        </div>
                        <div class="lg:col-span-2">
                            <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-md h-full">
                                <div class="flex justify-between items-center mb-6">
                                    <h3 class="text-lg font-bold">Recent Activity</h3>
                                    <button id="view-all-tx-btn" class="text-sm font-bold text-blue-600 hover:underline">View All</button>
                                </div>
                                <div id="transactions-list" class="space-y-4">
                                    <p class="text-gray-500 text-center py-10">No transactions yet.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="admin-panel" class="tab-content hidden">
                    <!-- Admin Panel Content... -->
                </div>
            </div>
            
            <div id="page-container" class="hidden"></div>
        </div>
    </div>

    <!-- Modals -->
    <div id="forgot-password-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm"></div>
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md p-6 relative z-10">
            <h3 class="text-xl font-bold mb-4">Reset Password</h3>
            <input type="email" id="reset-email-input" placeholder="Enter your email" class="w-full px-4 py-3 bg-gray-100 dark:bg-gray-700 rounded-xl mb-4">
            <div id="reset-error" class="text-red-500 text-sm mb-4"></div>
            <div class="flex justify-end gap-3">
                <button onclick="window.closeForgotPasswordModal()" class="px-6 py-2 font-bold text-gray-500">Cancel</button>
                <button id="send-reset-btn" class="px-6 py-2 bg-blue-600 text-white font-bold rounded-xl">Send Link</button>
            </div>
        </div>
    </div>

    <!-- Sounds -->
    <audio id="success-sound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" preload="auto"></audio>
    <audio id="error-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3" preload="auto"></audio>
    <audio id="notification-sound" src="https://assets.mixkit.co/active_storage/sfx/2357/2357-preview.mp3" preload="auto"></audio>

    <!-- App Entry -->
    <script type="module" src="js/app.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <title>Reviews World</title>
    <meta name="description" content="Reviews World is the official companion app for managing tasks, reward points, community updates, and support.">
    <meta name="application-name" content="Reviews World">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" href="/assets/images/logo_192.png">
    <link rel="apple-touch-icon" href="/assets/images/logo_192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/src/styles/tailwind.generated.css">
    <link rel="stylesheet" href="/src/styles/app.css">
    <link rel="manifest" href="/manifest.json">
    <style>
        html, body {
            background-color: #f3f4f6;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        html.dark, html.dark body {
            background-color: #0f172a !important;
        }
    </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans">
    <div id="rw-wallet-root"></div>

    <script type="module" src="/src/shell.js"></script>
    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/main.js"></script>
    <script>
        // OneSignal Web SDK v16 bootstrap — MUST load as early as possible for reliable push registration
        // Uses the same App ID fallback value as backend/src/services/oneSignalService.js (DEFAULT_APP_ID_FALLBACK)
        window.OneSignal = window.OneSignal || [];
        OneSignal.push(function () {
            OneSignal.init({
                appId: '465e22bd-8540-437b-ba7b-efa14ef4069f',
                allowLocalhostAsSecureOrigin: true,
                notifyButton: { enable: false },
                persistNotification: false,
                welcomeNotification: { disable: true },
                serviceWorkerParam: { scope: '/onesignal/OneSignalSDKWorker.js' }
            });
        });
        (function () {
            var s = document.createElement('script');
            s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
            s.defer = true;
            s.async = true;
            document.head.appendChild(s);
        })();
    </script>
</body>

</html>

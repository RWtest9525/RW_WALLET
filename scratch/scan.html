<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #222; color: white; font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .avatar-box { border: 2px solid #555; padding: 5px; text-align: center; background: #333; }
        img { max-width: 100%; height: auto; border-radius: 10px; }
    </style>
</head>
<body>
    <h1>Scanned Avatars</h1>
    <div class="grid" id="grid"></div>

    <script>
        const img = new Image();
        img.src = '../public/avatars_sheet.png';
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            ctx.drawImage(img, 0, 0);

            const cols = 5;
            const rows = 2;
            const cellW = img.naturalWidth / cols;
            const cellH = img.naturalHeight / rows;
            
            const gridDiv = document.getElementById('grid');
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cellX = Math.round(c * cellW);
                    const cellY = Math.round(r * cellH);
                    
                    const imgData = ctx.getImageData(cellX, cellY, cellW, cellH);
                    const data = imgData.data;
                    
                    let minX = cellW, maxX = 0, minY = cellH, maxY = 0;
                    
                    for (let y = 0; y < cellH; y++) {
                        for (let x = 0; x < cellW; x++) {
                            const idx = (y * Math.round(cellW) + x) * 4;
                            const rVal = data[idx];
                            const gVal = data[idx+1];
                            const bVal = data[idx+2];
                            
                            if (rVal > 15 || gVal > 15 || bVal > 15) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                            }
                        }
                    }
                    
                    const boxW = maxX - minX;
                    const boxH = maxY - minY;
                    
                    const centerX = cellX + minX + boxW / 2;
                    const centerY = cellY + minY + boxH / 2;
                    
                    // We want to crop a square box centered around the face.
                    // The width of the oval is boxW. But since they are vertical ovals,
                    // let's crop a square of size boxW, and center it slightly higher than the center of the oval (about 5% higher) 
                    // because heads are located in the upper half of the ovals!
                    const cropSize = boxW;
                    const sx = centerX - cropSize / 2;
                    const sy = (centerY - boxH * 0.05) - cropSize / 2;
                    
                    console.log(`Col ${c}, Row ${r} - sx: ${sx.toFixed(1)}, sy: ${sy.toFixed(1)}, size: ${cropSize.toFixed(1)}`);
                    
                    const cropCanvas = document.createElement('canvas');
                    cropCanvas.width = 150;
                    cropCanvas.height = 150;
                    const cropCtx = cropCanvas.getContext('2d');
                    cropCtx.drawImage(img, sx, sy, cropSize, cropSize, 0, 0, 150, 150);
                    
                    const box = document.createElement('div');
                    box.className = 'avatar-box';
                    box.innerHTML = `<h3>Col ${c}, Row ${r}</h3>`;
                    
                    const cropImg = new Image();
                    cropImg.src = cropCanvas.toDataURL('image/jpeg', 0.95);
                    box.appendChild(cropImg);
                    gridDiv.appendChild(box);
                }
            }
        };
    </script>
</body>
</html>
